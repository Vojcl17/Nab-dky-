services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nabidky
      POSTGRES_USER: nabidky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte POSTGRES_PASSWORD v .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabidky -d nabidky"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nabidky:${POSTGRES_PASSWORD}@db:5432/nabidky?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Nastavte AUTH_SECRET v .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Pravidelné stahování výpisů z Fio (každou hodinu). Vyžaduje CRON_SECRET.
  fio-cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command: >
      sh -c 'while true; do
        sleep 3600;
        if [ -n "$$CRON_SECRET" ]; then
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/fio || true;
        fi;
      done'

volumes:
  db-data:
